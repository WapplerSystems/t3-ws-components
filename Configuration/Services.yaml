services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  WapplerSystems\WsComponents\:
    resource: '../Classes/*'
    exclude: '../Classes/{Scss/Event,Js/Event}'

  WapplerSystems\WsComponents\Scss\Registry\ScssComponentRegistry:
    public: true

  WapplerSystems\WsComponents\Scss\Compilation\ScssComponentCompiler:
    public: true

  WapplerSystems\WsComponents\Scss\ViewHelpers\RequireViewHelper:
    public: true

  WapplerSystems\WsComponents\Scss\DataProcessing\ScssComponentProcessor:
    public: true

  WapplerSystems\WsComponents\Js\Registry\JsComponentRegistry:
    public: true

  WapplerSystems\WsComponents\Js\Loader\JsComponentLoader:
    public: true

  WapplerSystems\WsComponents\Js\ViewHelpers\RequireViewHelper:
    public: true
